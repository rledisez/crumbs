<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- interactive-widget=resizes-content: on Android the keyboard shrinks the layout viewport via
         the native inset path, so bottom-anchored UI (editor toolbar) lands exactly on the keyboard —
         Chromium's visualViewport.height can under-report by the nav-bar height. iOS ignores this
         attribute and relies on the visualViewport tracking in NoteEditor instead. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      (function() {
        try {
          var p = JSON.parse(localStorage.getItem('crumbs-preferences') || '{}');
          var t = p.theme || 'system';
          if (t !== 'light' && t !== 'dark') t = 'system';
          var isSystem = t === 'system';
          var isDark = isSystem
            ? matchMedia('(prefers-color-scheme: dark)').matches
            : t === 'dark';
          if (isDark) {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
          if (!isSystem) {
            var color = isDark ? '#1c1c1e' : '#f5f5f7';
            document.querySelectorAll('meta[name="theme-color"]').forEach(function(m) {
              m.content = color;
            });
          }
        } catch(e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Crumbs" />
    <title>Crumbs</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
